<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="assets/css/styles.css" />
  <script defer src="/assets/js/calculator.js"></script>

  <title>Calculator</title>
</head>

<body class="container">
  <input type="text" name="display" id="display" value="0" />

  <div class="buttons">
    <button data-type="clear" type="button">AC</button>
    <button data-type="operator" data-operation="square" type="button">x<sup>2</sup></button>
    <button data-type="operator" data-operation="percent" type="button">&percnt;</button>
    <button data-type="operator" data-operation="divide" type="button">&divide;</button>

    <button data-type="number" data-number="7" type="button">7</button>
    <button data-type="number" data-number="8" type="button">8</button>
    <button data-type="number" data-number="9" type="button">9</button>
    <button data-type="operator" data-operation="multiply" type="button">&times;</button>

    <button data-type="number" data-number="4" type="button">4</button>
    <button data-type="number" data-number="5" type="button">5</button>
    <button data-type="number" data-number="6" type="button">6</button>
    <button data-type="operator" data-operation="subtract" type="button">&minus;</button>

    <button data-type="number" data-number="1" type="button">1</button>
    <button data-type="number" data-number="2" type="button">2</button>
    <button data-type="number" data-number="3" type="button">3</button>
    <button data-type="operator" data-operation="add" type="button">&plus;</button>

    <button data-type="number" data-number="0" type="button">0</button>
    <button data-type="operator" data-operation="comma" type="button">&comma;</button>
    <button data-type="equals" type="button">&equals;</button>

  </div>
</body>

</html>
